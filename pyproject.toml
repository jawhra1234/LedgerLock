[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlock"
version = "0.1.0"
description = "AI Finance Controller: three-way settlement reconciliation with measured accuracy and an honest exception list."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    # The Gemini provider posts to the REST endpoint directly rather than
    # pulling in an SDK to call one URL.
    "httpx>=0.27",
    # Reads GEMINI_API_KEY from .env for `run --llm live`. Not needed to
    # reproduce any published number -- the model cache is committed.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# The dashboard is a read-only view over data/out/*.json. Optional on purpose:
# every number it shows is already in the CLI reports, so nothing about the
# result depends on having it installed.
app = ["streamlit>=1.30"]

[project.scripts]
ledgerlock = "ledgerlock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
