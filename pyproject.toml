[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlock"
version = "0.1.0"
description = "AI Finance Controller: three-way settlement reconciliation with measured accuracy and an honest exception list."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "typer>=0.9", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ledgerlock = "ledgerlock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
